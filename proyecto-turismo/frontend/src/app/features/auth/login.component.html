<section class="auth-page">
  <form class="form-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <p class="eyebrow">Bienvenido de vuelta</p>
    <h1>Iniciar sesión</h1>
    <p class="intro">Ingresa para solicitar reservas o administrar tus publicaciones.</p>
    @if (errorMessage) {
      <p class="alert" role="alert">{{ errorMessage }}</p>
    }
    <label for="email">Correo electrónico</label>
    <input id="email" type="email" autocomplete="email" formControlName="email">
    <app-field-error [control]="form.controls.email" [serverError]="serverErrors['email']" />
    <label for="password">Contraseña</label>
    <input id="password" type="password" autocomplete="current-password" formControlName="password">
    <app-field-error [control]="form.controls.password" [serverError]="serverErrors['password']" />
    <button class="primary-button" type="submit" [disabled]="submitting">
      {{ submitting ? 'Ingresando…' : 'Iniciar sesión' }}
    </button>
    <p class="form-foot">¿Aún no tienes cuenta? <a routerLink="/registro">Regístrate</a></p>
  </form>
</section>
