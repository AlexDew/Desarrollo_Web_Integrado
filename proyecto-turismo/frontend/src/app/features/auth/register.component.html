<section class="auth-page">
  <form class="form-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <p class="eyebrow">Explora Piura</p>
    <h1>Crear cuenta</h1>
    <p class="intro">Al registrarte obtendrás el rol de turista. Más adelante puedes solicitar un rol de proveedor.</p>
    @if (errorMessage) {
      <p class="alert" role="alert">{{ errorMessage }}</p>
    }
    <label for="nombre">Nombre</label>
    <input id="nombre" autocomplete="name" formControlName="nombre">
    <app-field-error [control]="form.controls.nombre" [serverError]="serverErrors['nombre']" />
    <label for="email">Correo electrónico</label>
    <input id="email" type="email" autocomplete="email" formControlName="email">
    <app-field-error [control]="form.controls.email" [serverError]="serverErrors['email']" />
    <label for="password">Contraseña</label>
    <input id="password" type="password" autocomplete="new-password" formControlName="password">
    <app-field-error [control]="form.controls.password" [serverError]="serverErrors['password']" />
    <button class="primary-button" type="submit" [disabled]="submitting">
      {{ submitting ? 'Creando cuenta…' : 'Crear cuenta' }}
    </button>
    <p class="form-foot">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
  </form>
</section>
