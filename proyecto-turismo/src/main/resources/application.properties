spring.application.name=proyecto
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=turismo_piura;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:turismo_user}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
